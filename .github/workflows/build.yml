# Builds the debug APK on GitHub's runners so you don't need Android Studio
# or a local SDK. Push this repo, then grab the APK from the run's Artifacts.
name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate wrapper if missing
        run: gradle wrapper --gradle-version 8.7

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ringcursor-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
